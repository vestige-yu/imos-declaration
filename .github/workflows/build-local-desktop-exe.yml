name: Build Windows report processing app

on:
  workflow_dispatch:
  push:
    paths:
      - "local_desktop_app/**"
      - "报表合并/**"
      - "tests/**"
      - "最新逻辑_请优先看/**"
      - "报关单模板-标记版.xlsx"
      - "模板标记维护说明.md"
      - ".github/workflows/build-local-desktop-exe.yml"

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r local_desktop_app/requirements.txt

      - name: Test declaration matching
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 |
            Tee-Object -FilePath declaration-test.log
          if ($LASTEXITCODE -ne 0) {
            $escaped = (
              Get-Content declaration-test.log -Tail 80 |
                ForEach-Object {
                  $_.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
                }
            ) -join "%0A"
            Write-Host "::error title=Windows declaration test failure::$escaped"
            exit 1
          }

      - name: Test report merge
        run: python -m unittest discover -s "报表合并/tests" -v

      - name: Build combined exe
        working-directory: local_desktop_app
        shell: pwsh
        run: .\build_windows.ps1

      - name: Smoke test packaged exe
        working-directory: local_desktop_app
        shell: pwsh
        run: |
          $exe = Get-Item -Path ".\dist\报表处理工具.exe"
          & $exe.FullName --self-test

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: 报表处理工具-windows-exe
          path: local_desktop_app/dist/报表处理工具.exe

      - name: Upload customer package
        uses: actions/upload-artifact@v4
        with:
          name: 报表处理工具-客户交付包
          path: local_desktop_app/dist/报表处理工具-客户交付包.zip
